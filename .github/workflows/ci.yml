name: Frontend CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: hikingalone-dist
          path: dist/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # 必须 checkout：后面 scp deploy/nginx-hikingalone.conf 依赖仓库里的文件（只有 download-artifact 的话该文件在 runner 上不存在）
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hikingalone-dist
          path: dist

      - name: Upload dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "dist/*"
          target: "/tmp/hikingalone-frontend/"
          # scp-action 用 tar 传输并保留 source 目录结构（dist/* 会带 dist/ 层）；strip_components: 1 去掉这层，内容直接落在 target 根
          strip_components: 1

      - name: Deploy to Nginx root
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            # strip_components: 1 已拍平 dist/ 层，内容直接落在 /tmp/hikingalone-frontend/（index.html、assets/ 等）
            sudo rm -rf /var/www/hikingalone/*
            sudo mkdir -p /var/www/hikingalone
            ls -la /tmp/hikingalone-frontend/
            sudo mv /tmp/hikingalone-frontend/* /var/www/hikingalone/
            # mv 出来的文件属主是 root，nginx worker 以 www-data 运行，需保证可读，否则静态文件 403
            sudo chown -R www-data:www-data /var/www/hikingalone
            sudo chmod -R 755 /var/www/hikingalone
            test -f /var/www/hikingalone/index.html && echo "index.html deployed OK"
            ls -la /var/www/hikingalone/ | head -20

      # Nginx 配置随代码版本化：推送 main 时同步到服务器，避免"代码加了 /user、/login，服务器配置还是旧的"
      # scp-action 用 tar 保留 source 目录结构，单文件 deploy/nginx-hikingalone.conf 会落在 target/deploy/ 下；
      # strip_components: 1 去掉 deploy/ 层，cp 路径才是 /tmp/hikingalone-nginx/nginx-hikingalone.conf
      - name: Upload Nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/nginx-hikingalone.conf"
          target: "/tmp/hikingalone-nginx/"
          # 同上：去掉 deploy/ 目录层，让文件直接落在 /tmp/hikingalone-nginx/nginx-hikingalone.conf
          strip_components: 1

      - name: Install and reload Nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            # 源文件可能因 scp 落点差异不存在，先确认；不存在则直接失败（红），不再被 nginx -t 掩盖
            ls -la /tmp/hikingalone-nginx/
            test -f /tmp/hikingalone-nginx/nginx-hikingalone.conf || { echo "nginx conf not uploaded"; exit 1; }
            sudo cp /tmp/hikingalone-nginx/nginx-hikingalone.conf /etc/nginx/conf.d/hikingalone.conf
            # 校验关键指令确实写入目标，防止 cp 目标路径不对导致线上仍是旧配置
            grep -q "server_name _" /etc/nginx/conf.d/hikingalone.conf && echo "conf check OK"
            sudo nginx -t && sudo systemctl reload nginx
            # 指纹验证：新配置的静态资源规则带 immutable 缓存头
            curl -sI http://127.0.0.1/assets/verify.js | grep -i "cache-control" || echo "WARN: no immutable cache header"
