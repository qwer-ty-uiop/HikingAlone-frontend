# Hiking Alone 前端站点 + 后端反代配置（由 GitHub Actions CD 自动同步到 /etc/nginx/conf.d/hikingalone.conf）
# 源：HikingAlone-frontend/deploy/nginx-hikingalone.conf
# 修改此文件后推送 main，CD 会自动 nginx -t 并 reload；若测试失败不会覆盖线上配置。

# 天地图瓦片缓存区：瓦片内容不可变，首次回源后永久缓存（inactive=365d），
# 后续所有用户/会话命中本地缓存，不再消耗天地图每日 1 万次配额。
# keys_zone 10m 可索引约 8 万片；max_size 2g 足够覆盖常用区域全部层级。
# 本文件由 nginx.conf 的 http{} 内 include，proxy_cache_path 属 http 上下文，写在 server 外合法。
proxy_cache_path /var/cache/nginx/tdt levels=1:2 keys_zone=tdt_cache:10m
                 max_size=2g inactive=365d use_temp_path=off;

server {
    listen 80;
    server_name _;

    root /var/www/hikingalone;
    index index.html;

    # 1. 静态资源：存在则长缓存；缺失直接 404（避免资源缺失被 HTML 兜底掩盖，难排查）
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?|ttf|otf|eot|webp|avif|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 2. 天地图瓦片缓存代理（精确匹配，优先级高于下方正则与 location /）：
    #    /tdt/DataServer?T=img_w|cia_w&x=&y=&l=&tk= → 回源 t0.tianditu.gov.cn
    #    瓦片不可变，命中缓存后 0 次天地图调用；只缓存 200，418/错误不缓存。
    location = /tdt/DataServer {
        proxy_cache tdt_cache;
        proxy_cache_valid 200 365d;
        # 缓存 key 只看图层+层级+坐标，忽略 tk，避免同一瓦片因 key 不同重复缓存
        proxy_cache_key "$arg_T|$arg_l|$arg_x|$arg_y";
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ssl_server_name on;
        proxy_set_header Host t0.tianditu.gov.cn;
        proxy_pass https://t0.tianditu.gov.cn/DataServer?$args;
        # 浏览器端也缓存 1 年，进一步减少回源
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
    }

    # 3. 后端 API + 前端路由分流。
    #    /home、/train、/user、/email、/routes 及其子路径不带尾斜杠也在此正则内（GET /home、GET /routes 都是无斜杠请求）。
    #    浏览器刷新 /train|/routes 页面（Accept 含 text/html）时回前端路由 index.html；
    #    其余请求（fetch，Accept: */* 等）反代到后端 —— 与前端 vite proxy 的 bypass 逻辑一致。
    location ~ ^/(home|train|user|email|routes)(/.*)?$ {
        if ($http_accept ~* text/html) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. 前端路由：/login 返回 index.html（登录/注册页，401 跳转或直接刷新都走这里）；
    #    /、/train、/routes 已被上方正则匹配（text/html 时回退 index.html）；
    #    其余未知路径返回真实 404
    location = /login {
        try_files /index.html =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }

    # 5. index.html 不缓存（内容随构建变化，引用带 hash 的 assets）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
