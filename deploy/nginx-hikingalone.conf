# Hiking Alone 前端站点 + 后端反代配置（由 GitHub Actions CD 自动同步到 /etc/nginx/conf.d/hikingalone.conf）
# 源：HikingAlone-frontend/deploy/nginx-hikingalone.conf
# 修改此文件后推送 main，CD 会自动 nginx -t 并 reload；若测试失败不会覆盖线上配置。

server {
    listen 80;
    server_name _;

    root /var/www/hikingalone;
    index index.html;

    # 1. 静态资源：存在则长缓存；缺失直接 404（避免资源缺失被 HTML 兜底掩盖，难排查）
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?|ttf|otf|eot|webp|avif|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 2. 后端 API + 前端路由分流。
    #    /home、/train、/user、/email、/routes 及其子路径不带尾斜杠也在此正则内（GET /home、GET /routes 都是无斜杠请求）。
    #    浏览器刷新 /train|/routes 页面（Accept 含 text/html）时回前端路由 index.html；
    #    其余请求（fetch，Accept: */* 等）反代到后端 —— 与前端 vite proxy 的 bypass 逻辑一致。
    location ~ ^/(home|train|user|email|routes)(/.*)?$ {
        if ($http_accept ~* text/html) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. 前端路由：/login 返回 index.html（登录/注册页，401 跳转或直接刷新都走这里）；
    #    /、/train、/routes 已被上方正则匹配（text/html 时回退 index.html）；
    #    其余未知路径返回真实 404
    location = /login {
        try_files /index.html =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }

    # 4. index.html 不缓存（内容随构建变化，引用带 hash 的 assets）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
